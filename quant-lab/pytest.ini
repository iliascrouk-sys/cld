[pytest]
testpaths = tests
# 'tests' entra en sys.path para poder importar conftest.py como módulo
# normal (las utilidades de datos sintéticos viven ahí).
pythonpath = . tests
addopts = -q --strict-markers
# Los avisos de pandas sobre cambios futuros se tratan como errores: este
# proyecto se apoya mucho en el comportamiento de las fechas de pandas, y ese
# comportamiento ha cambiado entre versiones de formas que no dan error sino
# números equivocados. Mejor enterarse por un test que por un backtest raro.
filterwarnings =
    error::FutureWarning
